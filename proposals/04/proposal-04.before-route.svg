<svg viewBox="0 0 3840 2160" xmlns="http://www.w3.org/2000/svg">
<g id="m3458764690579560266" data-miro-id="3458764690579560266" transform="translate(1275,12500)" data-frame="04B TrekCAP: controlled builds and RD delivery">
<rect data-type="frame" x="0" y="0" width="3152" height="1910" fill="#ffffff" data-title="04B TrekCAP: controlled builds and RD delivery" />
<textArea id="m3458764690579560307" data-miro-id="3458764690579560307" x="64" y="72.5" width="3024" height="47" fill="#1a1a1a" font-family="noto_sans" font-size="33" text-align="left" font-weight="bold">04B TrekCAP: controlled builds and RD delivery</textArea>
<textArea id="m3458764690579560308" data-miro-id="3458764690579560308" x="64" y="152.5" width="3024" height="31" fill="#595959" font-family="noto_sans" font-size="22" text-align="left">Application developers / restricted-source owners / QA / DevOps | Draft | Connect permitted source through versioned artifacts and explicit test evidence.</textArea>
<textArea id="m3458764690579560309" data-miro-id="3458764690579560309" x="64" y="1757" width="3024" height="26" fill="#595959" font-family="noto_sans" font-size="18" text-align="left">Blue = proposed | Gray = saved evidence or context | Yellow = boundary, exception or team decision</textArea>
<textArea id="m3458764690579560310" data-miro-id="3458764690579560310" x="64" y="248.5" width="3024" height="31" fill="#1a1a1a" font-family="noto_sans" font-size="22" text-align="left" font-weight="bold">Restricted-source path: its own owners, review and build identity</textArea>
<rect id="m3458764690579560311" data-miro-id="3458764690579560311" x="64" y="352" width="880" height="192" data-content="&lt;b&gt;1. Review restricted-source changes&lt;/b&gt;&lt;br /&gt;Authorized owners review kernel/employee-only changes.&lt;br /&gt;Keep source and trusted build authority in their boundary." fill="#a0c4fb" data-text-color="#14315e" data-font-family="noto_sans" data-font-size="22" data-text-align="left" data-text-align-vertical="middle" stroke="#6a8bbf" />
<rect id="m3458764690579560312" data-miro-id="3458764690579560312" x="1104" y="352" width="880" height="192" data-content="&lt;b&gt;2. Build and inspect approved artifacts&lt;/b&gt;&lt;br /&gt;Run the applicable sealing, IP and image checks.&lt;br /&gt;Resolve incomplete build paths before relying on them." fill="#a0c4fb" data-text-color="#14315e" data-font-family="noto_sans" data-font-size="22" data-text-align="left" data-text-align-vertical="middle" stroke="#6a8bbf" />
<rect id="m3458764690579560313" data-miro-id="3458764690579560313" x="2144" y="352" width="880" height="192" data-content="&lt;b&gt;3. Publish versioned artifacts&lt;/b&gt;&lt;br /&gt;Record source revision, image digest or package version.&lt;br /&gt;Grant consumers only the artifact access they need." fill="#a0c4fb" data-text-color="#14315e" data-font-family="noto_sans" data-font-size="22" data-text-align="left" data-text-align-vertical="middle" stroke="#6a8bbf" />
<textArea id="m3458764690579560314" data-miro-id="3458764690579560314" x="64" y="708.5" width="1000" height="31" fill="#1a1a1a" font-family="noto_sans" font-size="22" text-align="left" font-weight="bold">Product-source path: compatible access and explicit dependencies</textArea>
<rect id="m3458764690579560315" data-miro-id="3458764690579560315" x="64" y="800" width="880" height="224" data-content="&lt;b&gt;4. Review product/service changes&lt;/b&gt;&lt;br /&gt;Work in the agreed source area; check affected contracts.&lt;br /&gt;Restricted-source changes follow the path above.&lt;br /&gt;Review each affected owner’s scope." fill="#a0c4fb" data-text-color="#14315e" data-font-family="noto_sans" data-font-size="22" data-text-align="left" data-text-align-vertical="middle" stroke="#6a8bbf" />
<rect id="m3458764690579560316" data-miro-id="3458764690579560316" x="1104" y="800" width="880" height="224" data-content="&lt;b&gt;5. Build affected services&lt;/b&gt;&lt;br /&gt;Pin approved images and module/package versions.&lt;br /&gt;Run applicable code, image and IP checks.&lt;br /&gt;Keep service artifacts separately identifiable." fill="#a0c4fb" data-text-color="#14315e" data-font-family="noto_sans" data-font-size="22" data-text-align="left" data-text-align-vertical="middle" stroke="#6a8bbf" />
<rect id="m3458764690579560317" data-miro-id="3458764690579560317" x="2144" y="800" width="880" height="224" data-content="&lt;b&gt;6. Require agreed release tests&lt;/b&gt;&lt;br /&gt;Test the exact image/version combination.&lt;br /&gt;Run Tier 2 integration and relevant TrekFinder E2E tests.&lt;br /&gt;Proposed: selected passing tests gate the GitOps handoff." fill="#a0c4fb" data-text-color="#14315e" data-font-family="noto_sans" data-font-size="22" data-text-align="left" data-text-align-vertical="middle" stroke="#6a8bbf" />
<rect id="m3458764690579560318" data-miro-id="3458764690579560318" x="64" y="1216" width="880" height="224" data-content="&lt;b&gt;Saved baseline and limits&lt;/b&gt;&lt;br /&gt;RD is the identified CAP target; stage/prod are not established.&lt;br /&gt;Tier 2 dispatch occurs after the GitOps merge in saved code.&lt;br /&gt;Current success and effective blocking are unverified." fill="#ddddd8" data-text-color="#434339" data-font-family="noto_sans" data-font-size="22" data-text-align="left" data-text-align-vertical="middle" stroke="#a8a8a0" />
<rect id="m3458764690579560319" data-miro-id="3458764690579560319" x="1104" y="1216" width="880" height="224" data-content="&lt;b&gt;Required gate fails: stop the release&lt;/b&gt;&lt;br /&gt;Return findings to the responsible source/build owner.&lt;br /&gt;Correct, review, rebuild and rerun affected tests.&lt;br /&gt;Agree the response to failed RD acceptance checks." fill="#ffe86d" data-text-color="#574900" data-font-family="noto_sans" data-font-size="22" data-text-align="left" data-text-align-vertical="middle" stroke="#cbb333" />
<rect id="m3458764690579560320" data-miro-id="3458764690579560320" x="2144" y="1216" width="880" height="224" data-content="&lt;b&gt;7. Propose, deploy and verify RD&lt;/b&gt;&lt;br /&gt;GitOps approval selects the intended artifact versions.&lt;br /&gt;Argo CD reconciles; QA verifies the deployed journeys.&lt;br /&gt;Record versions, outcome and recovery evidence." fill="#a0c4fb" data-text-color="#14315e" data-font-family="noto_sans" data-font-size="22" data-text-align="left" data-text-align-vertical="middle" stroke="#6a8bbf" />
<rect id="m3458764690579560321" data-miro-id="3458764690579560321" x="64" y="1504" width="3024" height="160" data-content="&lt;b&gt;Agree the controls before implementation&lt;/b&gt;&lt;br /&gt;Source-access groups, policy owners, artifact consumers, required pre-deployment tests and recovery owners remain team decisions.&lt;br /&gt;Keep post-deployment verification as well. Future stage/prod and promotion-policy design belong to separately agreed scope with Proposal 11." fill="#ffe86d" data-text-color="#574900" data-font-family="noto_sans" data-font-size="22" data-text-align="left" data-text-align-vertical="middle" stroke="#cbb333" />
<textArea id="m3458764690579560322" data-miro-id="3458764690579560322" x="64" y="1817" width="3024" height="26" fill="#595959" font-family="noto_sans" font-size="18" text-align="left">Basis: CAP source/delivery snapshots Nov 2–3 and qualified GitOps assessment Nov 6, 2026. Pre-handoff test gates and artifact traceability above are proposals, not verified live controls.</textArea>
<line id="m3458764690579560358" data-miro-id="3458764690579560358" x1="0" y1="0" x2="1" y2="1" data-start="m3458764690579560311" data-end="m3458764690579560312" stroke="#313131" stroke-width="2.0" data-arrow="end" data-shape="elbowed" data-start-side="right" data-end-side="left" data-content="Approved" />
<line id="m3458764690579560359" data-miro-id="3458764690579560359" x1="0" y1="0" x2="1" y2="1" data-start="m3458764690579560312" data-end="m3458764690579560313" stroke="#313131" stroke-width="2.0" data-arrow="end" data-shape="elbowed" data-start-side="right" data-end-side="left" data-content="Checks pass" />
<line id="m3458764690579560360" data-miro-id="3458764690579560360" x1="0" y1="0" x2="1" y2="1" data-start="m3458764690579560315" data-end="m3458764690579560316" stroke="#313131" stroke-width="2.0" data-arrow="end" data-shape="elbowed" data-start-side="right" data-end-side="left" data-content="Approved" />
<line id="m3458764690579560361" data-miro-id="3458764690579560361" x1="0" y1="0" x2="1" y2="1" data-start="m3458764690579560316" data-end="m3458764690579560317" stroke="#313131" stroke-width="2.0" data-arrow="end" data-shape="elbowed" data-start-side="right" data-end-side="left" data-content="Service images" />
<line id="m3458764690579560363" data-miro-id="3458764690579560363" x1="0" y1="0" x2="1" y2="1" data-start="m3458764690579560313" data-end="m3458764690579560316" stroke="#313131" stroke-width="2.0" data-arrow="end" data-shape="elbowed" data-start-side="bottom" data-end-side="top" data-content="Pinned artifacts" />
<line id="m3458764690579560364" data-miro-id="3458764690579560364" x1="0" y1="0" x2="1" y2="1" data-start="m3458764690579560317" data-end="m3458764690579560320" stroke="#313131" stroke-width="2.0" data-arrow="end" data-shape="elbowed" data-start-side="bottom" data-end-side="top" data-content="Pass / GitOps approval" />
<line id="m3458764690579560365" data-miro-id="3458764690579560365" x1="0" y1="0" x2="1" y2="1" data-start="m3458764690579560317" data-end="m3458764690579560319" stroke="#313131" stroke-width="2.0" data-arrow="end" data-shape="elbowed" data-start-side="left" data-end-side="top" data-content="Failed required tests" />
</g>
</svg>

