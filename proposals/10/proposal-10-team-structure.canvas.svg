<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg">
  <g id="p10d" transform="translate(8945,30500)" data-frame="10D Team structure and access design">
    <rect data-type="frame" x="0" y="0" width="3152" height="1910" fill="#ffffff" data-title="10D Team structure and access design" />
    <textArea id="d-title" x="64" y="64" width="3024" height="64" font-family="noto_sans" font-size="33" font-weight="bold" fill="#1a1a1a" text-align="left">10D Team structure and access design</textArea>
    <textArea id="d-subtitle" x="64" y="148" width="3024" height="40" font-family="noto_sans" font-size="22" font-weight="normal" fill="#595959" text-align="left">Proposed / Draft | Agree responsibilities first, then define Entra groups, target permissions and temporary elevation.</textArea>
    <textArea id="d-col-0" x="64" y="264" width="576" height="40" font-family="noto_sans" font-size="22" font-weight="bold" fill="#1a1a1a" text-align="left">Team / role</textArea>
    <textArea id="d-col-1" x="704" y="264" width="704" height="40" font-family="noto_sans" font-size="22" font-weight="bold" fill="#1a1a1a" text-align="left">Work and boundary</textArea>
    <textArea id="d-col-2" x="1472" y="264" width="768" height="40" font-family="noto_sans" font-size="22" font-weight="bold" fill="#1a1a1a" text-align="left">Proposed baseline</textArea>
    <textArea id="d-col-3" x="2304" y="264" width="784" height="40" font-family="noto_sans" font-size="22" font-weight="bold" fill="#1a1a1a" text-align="left">Extra access / decision</textArea>
    <rect id="d-app-0" x="64" y="360" width="576" height="192" fill="#a0c4fb" stroke="#6a8bbf" stroke-width="2" data-content="&lt;b&gt;Application developers&lt;/b&gt;" data-font-family="noto_sans" data-font-size="22" data-text-color="#14315e" data-text-align="left" data-text-align-vertical="middle" />
    <rect id="d-app-1" x="704" y="360" width="704" height="192" fill="#a0c4fb" stroke="#6a8bbf" stroke-width="2" data-content="Build product / platform application code.&lt;br&gt;Scope Trek Learning (Hub/LMS)&lt;br&gt;and TrekCAP/TrekFinder separately." data-font-family="noto_sans" data-font-size="22" data-text-color="#14315e" data-text-align="left" data-text-align-vertical="middle" />
    <rect id="d-app-2" x="1472" y="360" width="768" height="192" fill="#a0c4fb" stroke="#6a8bbf" stroke-width="2" data-content="Approved source repositories and&lt;br&gt;development resources for assigned tasks.&lt;br&gt;Preserve restricted-source boundaries." data-font-family="noto_sans" data-font-size="22" data-text-color="#14315e" data-text-align="left" data-text-align-vertical="middle" />
    <rect id="d-app-3" x="2304" y="360" width="784" height="192" fill="#a0c4fb" stroke="#6a8bbf" stroke-width="2" data-content="Production diagnosis or admin work:&lt;br&gt;define a scoped, eligible entitlement.&lt;br&gt;Keep normal code/change review." data-font-family="noto_sans" data-font-size="22" data-text-color="#14315e" data-text-align="left" data-text-align-vertical="middle" />
    <rect id="d-devops-0" x="64" y="584" width="576" height="192" fill="#a0c4fb" stroke="#6a8bbf" stroke-width="2" data-content="&lt;b&gt;DevOps&lt;/b&gt;" data-font-family="noto_sans" data-font-size="22" data-text-color="#14315e" data-text-align="left" data-text-align-vertical="middle" />
    <rect id="d-devops-1" x="704" y="584" width="704" height="192" fill="#a0c4fb" stroke="#6a8bbf" stroke-width="2" data-content="Build and operate environments,&lt;br&gt;infrastructure and delivery tooling.&lt;br&gt;Maintain templates and automation." data-font-family="noto_sans" data-font-size="22" data-text-color="#14315e" data-text-align="left" data-text-align-vertical="middle" />
    <rect id="d-devops-2" x="1472" y="584" width="768" height="192" fill="#a0c4fb" stroke="#6a8bbf" stroke-width="2" data-content="Agreed non-production operations&lt;br&gt;and delivery/configuration access.&lt;br&gt;Automation has its own identity." data-font-family="noto_sans" data-font-size="22" data-text-color="#14315e" data-text-align="left" data-text-align-vertical="middle" />
    <rect id="d-devops-3" x="2304" y="584" width="784" height="192" fill="#a0c4fb" stroke="#6a8bbf" stroke-width="2" data-content="Production change or recovery:&lt;br&gt;define task, target and time window.&lt;br&gt;Review execution identity separately." data-font-family="noto_sans" data-font-size="22" data-text-color="#14315e" data-text-align="left" data-text-align-vertical="middle" />
    <rect id="d-qa-0" x="64" y="808" width="576" height="192" fill="#a0c4fb" stroke="#6a8bbf" stroke-width="2" data-content="&lt;b&gt;QA&lt;/b&gt;" data-font-family="noto_sans" data-font-size="22" data-text-color="#14315e" data-text-align="left" data-text-align-vertical="middle" />
    <rect id="d-qa-1" x="704" y="808" width="704" height="192" fill="#a0c4fb" stroke="#6a8bbf" stroke-width="2" data-content="Test releases and report defects.&lt;br&gt;Request approved QA environments;&lt;br&gt;record acceptance evidence." data-font-family="noto_sans" data-font-size="22" data-text-color="#14315e" data-text-align="left" data-text-align-vertical="middle" />
    <rect id="d-qa-2" x="1472" y="808" width="768" height="192" fill="#a0c4fb" stroke="#6a8bbf" stroke-width="2" data-content="Test accounts, allowed diagnostics&lt;br&gt;and controlled environment requests.&lt;br&gt;No default Terraform/cloud admin." data-font-family="noto_sans" data-font-size="22" data-text-color="#14315e" data-text-align="left" data-text-align-vertical="middle" />
    <rect id="d-qa-3" x="2304" y="808" width="784" height="192" fill="#a0c4fb" stroke="#6a8bbf" stroke-width="2" data-content="Sensitive data or production access:&lt;br&gt;separate review and scoped access.&lt;br&gt;Keep demo/client-pilot rules separate." data-font-family="noto_sans" data-font-size="22" data-text-color="#14315e" data-text-align="left" data-text-align-vertical="middle" />
    <rect id="d-lead-0" x="64" y="1032" width="576" height="192" fill="#a0c4fb" stroke="#6a8bbf" stroke-width="2" data-content="&lt;b&gt;Management / leadership&lt;/b&gt;" data-font-family="noto_sans" data-font-size="22" data-text-color="#14315e" data-text-align="left" data-text-align-vertical="middle" />
    <rect id="d-lead-1" x="704" y="1032" width="704" height="192" fill="#a0c4fb" stroke="#6a8bbf" stroke-width="2" data-content="Leads, managers and directors:&lt;br&gt;coordinate delivery, quality and oversight.&lt;br&gt;Exact reporting structure remains open." data-font-family="noto_sans" data-font-size="22" data-text-color="#14315e" data-text-align="left" data-text-align-vertical="middle" />
    <rect id="d-lead-2" x="1472" y="1032" width="768" height="192" fill="#a0c4fb" stroke="#6a8bbf" stroke-width="2" data-content="Agreed reports and dashboards.&lt;br&gt;Hands-on leads receive separately&lt;br&gt;assigned technical task roles." data-font-family="noto_sans" data-font-size="22" data-text-color="#14315e" data-text-align="left" data-text-align-vertical="middle" />
    <rect id="d-lead-3" x="2304" y="1032" width="784" height="192" fill="#a0c4fb" stroke="#6a8bbf" stroke-width="2" data-content="Title alone grants no admin rights.&lt;br&gt;Assign approval authority explicitly;&lt;br&gt;manage conflicts of interest by policy." data-font-family="noto_sans" data-font-size="22" data-text-color="#14315e" data-text-align="left" data-text-align-vertical="middle" />
    <textArea id="d-map-title" x="64" y="1300" width="3024" height="40" font-family="noto_sans" font-size="22" font-weight="bold" fill="#1a1a1a" text-align="left">Access design record for each team / task</textArea>
    <rect id="d-map" x="64" y="1380" width="3024" height="160" fill="#ddddd8" stroke="#a8a8a0" stroke-width="2" data-content="Team + task + product + environment → approved Entra group → target role and resource/repository scope.&lt;br&gt;Record group owner, membership rules and mapping; keep baseline separate from elevation eligibility.&lt;br&gt;For elevation: purpose, eligible identities, roles/scope, approval policy, maximum duration, owner and removal evidence." data-font-family="noto_sans" data-font-size="22" data-text-color="#434339" data-text-align="left" data-text-align-vertical="middle" />
    <rect id="d-decisions" x="64" y="1604" width="3024" height="128" fill="#ffe86d" stroke="#cbb333" stroke-width="2" data-content="&lt;b&gt;Decisions before rollout&lt;/b&gt;&lt;br&gt;Agree team boundaries, reporting relationships, memberships, role names, access owners and approvers. Exact permissions remain to design.&lt;br&gt;Validate each target integration; test allowed/denied actions, role changes, overlapping grants and removal." data-font-family="noto_sans" data-font-size="22" data-text-color="#574900" data-text-align="left" data-text-align-vertical="middle" />
    <textArea id="d-legend" x="64" y="1764" width="3024" height="32" font-family="noto_sans" font-size="18" font-weight="normal" fill="#595959" text-align="left">Blue = proposed responsibilities / access | Gray = design record | Yellow = decisions; no teams, groups or permissions are configured.</textArea>
    <textArea id="d-evidence" x="64" y="1828" width="3024" height="32" font-family="noto_sans" font-size="18" font-weight="normal" fill="#595959" text-align="left">Basis: original proposal notes, Nov 12 discussion (07:43–10:37), and user clarification Nov 24, 2026. Reporting lines and authority are unconfirmed.</textArea>
  </g>
</svg>