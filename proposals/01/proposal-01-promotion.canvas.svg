<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="5970" height="4690">
  <g id="m3458764690575950778" transform="translate(-1017,2780)" data-frame="01D Terraform: branches and promotion">
    <rect data-type="frame" x="0" y="0" width="3152" height="1910" fill="#ffffff" data-title="01D Terraform: branches and promotion" />
    <textArea id="m3458764690575950790" x="64" y="72.5" width="3024" height="47" fill="#1a1a1a" font-family="noto_sans" font-size="33" text-align="left" font-weight="bold">01D Terraform: branches and promotion</textArea>
    <textArea id="m3458764690575950791" x="64" y="152.5" width="3024" height="31" fill="#595959" font-family="noto_sans" font-size="22" text-align="left">Supporting view for <a href="https://miro.com/app/board/uXjVEOGaQYU=/?moveToWidget=3458764690359619683">01B</a> | Draft recommendation | Shows how its core workflow repeats across dev, staging and production.</textArea>
    <textArea id="m3458764690575950792" x="64" y="1757" width="3024" height="26" fill="#595959" font-family="noto_sans" font-size="18" text-align="left">Blue = proposed process | Gray = explanation or evidence | Yellow = gate, alternative or team decision</textArea>
    <textArea id="m3458764690575950793" x="64" y="248.5" width="3024" height="31" fill="#1a1a1a" font-family="noto_sans" font-size="22" text-align="left" font-weight="bold">Three different choices</textArea>
    <rect id="m3458764690575950794" x="64" y="320" width="880" height="192" data-content="&lt;b&gt;Branch / commit&lt;/b&gt;&lt;br /&gt;Which version of the code is selected.&lt;br /&gt;A branch name alone does not select dev or prod." fill="#ddddd8" data-text-color="#434339" data-font-family="noto_sans" data-font-size="22" data-text-align="left" data-text-align-vertical="middle" stroke="#a8a8a0" stroke-width="2" />
    <rect id="m3458764690575950795" x="1104" y="320" width="880" height="192" data-content="&lt;b&gt;Environment target&lt;/b&gt;&lt;br /&gt;Configuration folder + inputs + state&lt;br /&gt;and cloud identity select what is changed." fill="#ddddd8" data-text-color="#434339" data-font-family="noto_sans" data-font-size="22" data-text-align="left" data-text-align-vertical="middle" stroke="#a8a8a0" stroke-width="2" />
    <rect id="m3458764690575950796" x="2144" y="320" width="880" height="192" data-content="&lt;b&gt;Release / tag&lt;/b&gt;&lt;br /&gt;An optional label for a specific version.&lt;br /&gt;It can identify the version tested in dev first." fill="#ddddd8" data-text-color="#434339" data-font-family="noto_sans" data-font-size="22" data-text-align="left" data-text-align-vertical="middle" stroke="#a8a8a0" stroke-width="2" />
    <textArea id="m3458764690575950797" x="64" y="580.5" width="3024" height="31" fill="#1a1a1a" font-family="noto_sans" font-size="22" text-align="left" font-weight="bold">01D expands 01B across environments; each process box names the corresponding 01B steps</textArea>
    <rect id="m3458764690575950798" x="64" y="656" width="400" height="256" data-content="&lt;b&gt;1. Review the PR&lt;/b&gt;&lt;br&gt;Checks and preview plans.&lt;br&gt;Review code and target impact.&lt;br&gt;&lt;b&gt;01B: steps 1–5&lt;/b&gt;" fill="#a0c4fb" data-text-color="#14315e" data-font-family="noto_sans" data-font-size="22" data-text-align="left" data-text-align-vertical="middle" stroke="#6a8bbf" stroke-width="2" />
    <rect id="m3458764690575950799" x="584" y="656" width="400" height="256" data-content="&lt;b&gt;2. Merge to main&lt;/b&gt;&lt;br&gt;Record the exact revision.&lt;br&gt;Production does not run&lt;br&gt;just because code merged.&lt;br&gt;&lt;b&gt;01B: step 6&lt;/b&gt;" fill="#a0c4fb" data-text-color="#14315e" data-font-family="noto_sans" data-font-size="22" data-text-align="left" data-text-align-vertical="middle" stroke="#6a8bbf" stroke-width="2" />
    <rect id="m3458764690575950800" x="1104" y="656" width="400" height="256" data-content="&lt;b&gt;3. Apply to dev&lt;/b&gt;&lt;br&gt;Generate the final dev plan.&lt;br&gt;Authorize under dev policy.&lt;br&gt;Actions applies that plan.&lt;br&gt;&lt;b&gt;01B: steps 7–9 for dev&lt;/b&gt;" fill="#a0c4fb" data-text-color="#14315e" data-font-family="noto_sans" data-font-size="22" data-text-align="left" data-text-align-vertical="middle" stroke="#6a8bbf" stroke-width="2" />
    <rect id="m3458764690575950801" x="1624" y="656" width="400" height="256" data-content="&lt;b&gt;4. Verify dev&lt;/b&gt;&lt;br&gt;Check settings and acceptance.&lt;br&gt;Record results before promotion.&lt;br&gt;&lt;b&gt;01B: step 10&lt;/b&gt;&lt;br&gt;Test examples: &lt;a href=&quot;https://miro.com/app/board/uXjVEOGaQYU=/?moveToWidget=3458764690575950779&quot;&gt;01E&lt;/a&gt;" fill="#a0c4fb" data-text-color="#14315e" data-font-family="noto_sans" data-font-size="22" data-text-align="left" data-text-align-vertical="middle" stroke="#6a8bbf" stroke-width="2" />
    <rect id="m3458764690575950802" x="2144" y="656" width="400" height="256" data-content="&lt;b&gt;5. Promote to staging&lt;/b&gt;&lt;br&gt;Select the tested version.&lt;br&gt;Own plan, approval and apply.&lt;br&gt;Verify staging requirements.&lt;br&gt;&lt;b&gt;Repeat 01B steps 7–10&lt;/b&gt;" fill="#a0c4fb" data-text-color="#14315e" data-font-family="noto_sans" data-font-size="22" data-text-align="left" data-text-align-vertical="middle" stroke="#6a8bbf" stroke-width="2" />
    <rect id="m3458764690575950803" x="2664" y="656" width="400" height="256" data-content="&lt;b&gt;6. Promote to production&lt;/b&gt;&lt;br&gt;Select the tested version.&lt;br&gt;Own plan, approval and apply.&lt;br&gt;Verify production requirements.&lt;br&gt;&lt;b&gt;Repeat 01B steps 7–10&lt;/b&gt;" fill="#a0c4fb" data-text-color="#14315e" data-font-family="noto_sans" data-font-size="22" data-text-align="left" data-text-align-vertical="middle" stroke="#6a8bbf" stroke-width="2" />
    <rect id="m3458764690575950804" x="64" y="1072" width="1400" height="192" data-content="&lt;b&gt;Alternative: dev branch, then main branch&lt;/b&gt;&lt;br /&gt;This can work if workflows explicitly map each branch to its target.&lt;br /&gt;The branch mapping and each execution gate are team decisions." fill="#ffe86d" data-text-color="#574900" data-font-family="noto_sans" data-font-size="22" data-text-align="left" data-text-align-vertical="middle" stroke="#cbb333" stroke-width="2" />
    <rect id="m3458764690575950805" x="1624" y="1072" width="1464" height="192" data-content="&lt;b&gt;Required tests fail: stop promotion&lt;/b&gt;&lt;br&gt;01B step 10 supplies the acceptance evidence; failed required tests stop the next environment.&lt;br&gt;Correct the change and repeat review, planning and authorization as needed." fill="#ffe86d" data-text-color="#574900" data-font-family="noto_sans" data-font-size="22" data-text-align="left" data-text-align-vertical="middle" stroke="#cbb333" stroke-width="2" />
    <rect id="m3458764690575950806" x="64" y="1328" width="3024" height="160" data-content="&lt;b&gt;Promote a configuration version, not a dev plan file&lt;/b&gt;&lt;br /&gt;Each environment needs its own plan against its settings and current state. Never apply the dev plan to production.&lt;br /&gt;With separate folders, explicitly update the next target's configuration or tested module version; a tag does not copy edits between folders." fill="#ddddd8" data-text-color="#434339" data-font-family="noto_sans" data-font-size="22" data-text-align="left" data-text-align-vertical="middle" stroke="#a8a8a0" stroke-width="2" />
    <rect id="m3458764690575950807" x="64" y="1552" width="3024" height="128" data-content="&lt;b&gt;Team decisions:&lt;/b&gt; dev auto-apply versus approval; who accepts tests and authorizes promotion; revision/tag/module-version strategy.&lt;br /&gt;GitHub approval support depends on repository visibility and plan. This is per-change promotion, separate from rolling out the automation capability." fill="#ffe86d" data-text-color="#574900" data-font-family="noto_sans" data-font-size="22" data-text-align="left" data-text-align-vertical="middle" stroke="#cbb333" stroke-width="2" />
    <textArea id="m3458764690575950808" x="64" y="1817" width="3024" height="26" fill="#595959" font-family="noto_sans" font-size="18" text-align="left">Saved evidence: existing TL workflow plans development changes only; it has no apply job. Sources: Nov 3–4 snapshot; Terraform apply/plan and GitHub deployment documentation.</textArea>
    <line id="m3458764690575950854" x1="464.0" y1="784.0" x2="584.0" y2="784.0" data-start="m3458764690575950798" data-end="m3458764690575950799" stroke="#313131" stroke-width="2" data-arrow="end" data-shape="elbowed" data-start-side="right" data-end-side="left" data-content="Next" />
    <line id="m3458764690575950855" x1="984.0" y1="784.0" x2="1104.0" y2="784.0" data-start="m3458764690575950799" data-end="m3458764690575950800" stroke="#313131" stroke-width="2" data-arrow="end" data-shape="elbowed" data-start-side="right" data-end-side="left" data-content="Next" />
    <line id="m3458764690575950856" x1="1504.0" y1="784.0" x2="1624.0" y2="784.0" data-start="m3458764690575950800" data-end="m3458764690575950801" stroke="#313131" stroke-width="2" data-arrow="end" data-shape="elbowed" data-start-side="right" data-end-side="left" data-content="Next" />
    <line id="m3458764690575950857" x1="2024.0" y1="784.0" x2="2144.0" y2="784.0" data-start="m3458764690575950801" data-end="m3458764690575950802" stroke="#313131" stroke-width="2" data-arrow="end" data-shape="elbowed" data-start-side="right" data-end-side="left" data-content="Pass" />
    <line id="m3458764690575950858" x1="2544.0" y1="784.0" x2="2664.0" y2="784.0" data-start="m3458764690575950802" data-end="m3458764690575950803" stroke="#313131" stroke-width="2" data-arrow="end" data-shape="elbowed" data-start-side="right" data-end-side="left" data-content="Pass" />
    <line id="m3458764690575950861" x1="1824.0" y1="912.0" x2="2356.0" y2="1072.0" data-start="m3458764690575950801" data-end="m3458764690575950805" stroke="#313131" stroke-width="2" data-arrow="end" data-shape="elbowed" data-start-side="bottom" data-end-side="top" data-content="Failed required tests" />
  </g>
  <g id="m3458764690575950779" transform="translate(2818,2780)" data-frame="01E Terraform: verify the requirements">
    <rect data-type="frame" x="0" y="0" width="3152" height="1910" fill="#ffffff" data-title="01E Terraform: verify the requirements" />
    <textArea id="m3458764690575950809" x="64" y="72.5" width="3024" height="47" fill="#1a1a1a" font-family="noto_sans" font-size="33" text-align="left" font-weight="bold">01E Terraform: verify the requirements</textArea>
    <textArea id="m3458764690575950817" x="64" y="152.5" width="3024" height="31" fill="#595959" font-family="noto_sans" font-size="22" text-align="left">Supporting view for <a href="https://miro.com/app/board/uXjVEOGaQYU=/?moveToWidget=3458764690359619683">01B</a> | Draft | Explains checks before apply and the requirement tests within step 10, Verify outcome.</textArea>
    <textArea id="m3458764690575950818" x="64" y="1757" width="3024" height="26" fill="#595959" font-family="noto_sans" font-size="18" text-align="left">Blue = proposed process | Gray = explanation or evidence | Yellow = gate, alternative or team decision</textArea>
    <textArea id="m3458764690575950819" x="64" y="248.5" width="3024" height="31" fill="#1a1a1a" font-family="noto_sans" font-size="22" text-align="left" font-weight="bold">01E expands 01B validation: agree criteria first, inspect planned changes, then test the actual environment</textArea>
    <rect id="m3458764690575950820" x="64" y="320" width="768" height="96" data-content="&lt;b&gt;Requirement / acceptance criteria&lt;/b&gt;&lt;br&gt;Agree these before starting 01B." fill="#ddddd8" data-text-color="#434339" data-font-family="noto_sans" data-font-size="22" data-font-weight="bold" data-text-align="left" data-text-align-vertical="middle" stroke="#a8a8a0" stroke-width="2" />
    <rect id="m3458764690575950821" x="896" y="320" width="1056" height="96" data-content="&lt;b&gt;Before apply: planned configuration&lt;/b&gt;&lt;br&gt;01B steps 2–8: checks, plans, review and authorization." fill="#ddddd8" data-text-color="#434339" data-font-family="noto_sans" data-font-size="22" data-font-weight="bold" data-text-align="left" data-text-align-vertical="middle" stroke="#a8a8a0" stroke-width="2" />
    <rect id="m3458764690575950822" x="2016" y="320" width="1072" height="96" data-content="&lt;b&gt;After apply: deployed behavior&lt;/b&gt;&lt;br&gt;01B step 10: verify outcome and return status." fill="#ddddd8" data-text-color="#434339" data-font-family="noto_sans" data-font-size="22" data-font-weight="bold" data-text-align="left" data-text-align-vertical="middle" stroke="#a8a8a0" stroke-width="2" />
    <rect id="m3458764690575950823" x="64" y="448" width="768" height="160" data-content="Database settings" fill="#ddddd8" data-text-color="#434339" data-font-family="noto_sans" data-font-size="22" data-text-align="left" data-text-align-vertical="middle" stroke="#a8a8a0" stroke-width="2" />
    <rect id="m3458764690575950824" x="896" y="448" width="1056" height="160" data-content="Private access; agreed region, engine,&lt;br /&gt;capacity and backup settings." fill="#a0c4fb" data-text-color="#14315e" data-font-family="noto_sans" data-font-size="22" data-text-align="left" data-text-align-vertical="middle" stroke="#6a8bbf" stroke-width="2" />
    <rect id="m3458764690575950825" x="2016" y="448" width="1072" height="160" data-content="Read back the actual settings.&lt;br /&gt;Confirm the application connects." fill="#a0c4fb" data-text-color="#14315e" data-font-family="noto_sans" data-font-size="22" data-text-align="left" data-text-align-vertical="middle" stroke="#6a8bbf" stroke-width="2" />
    <rect id="m3458764690575950826" x="64" y="640" width="768" height="160" data-content="Network and access" fill="#ddddd8" data-text-color="#434339" data-font-family="noto_sans" data-font-size="22" data-text-align="left" data-text-align-vertical="middle" stroke="#a8a8a0" stroke-width="2" />
    <rect id="m3458764690575950827" x="896" y="640" width="1056" height="160" data-content="Only required paths and roles.&lt;br /&gt;Review exposure and permission changes." fill="#a0c4fb" data-text-color="#14315e" data-font-family="noto_sans" data-font-size="22" data-text-align="left" data-text-align-vertical="middle" stroke="#6a8bbf" stroke-width="2" />
    <rect id="m3458764690575950828" x="2016" y="640" width="1072" height="160" data-content="Required traffic succeeds.&lt;br /&gt;Unauthorized traffic and identities fail." fill="#a0c4fb" data-text-color="#14315e" data-font-family="noto_sans" data-font-size="22" data-text-align="left" data-text-align-vertical="middle" stroke="#6a8bbf" stroke-width="2" />
    <rect id="m3458764690575950829" x="64" y="832" width="768" height="160" data-content="Recovery readiness" fill="#ddddd8" data-text-color="#434339" data-font-family="noto_sans" data-font-size="22" data-text-align="left" data-text-align-vertical="middle" stroke="#a8a8a0" stroke-width="2" />
    <rect id="m3458764690575950830" x="896" y="832" width="1056" height="160" data-content="Backup and recovery configuration&lt;br /&gt;matches the agreed recovery targets." fill="#a0c4fb" data-text-color="#14315e" data-font-family="noto_sans" data-font-size="22" data-text-align="left" data-text-align-vertical="middle" stroke="#6a8bbf" stroke-width="2" />
    <rect id="m3458764690575950831" x="2016" y="832" width="1072" height="160" data-content="Run an agreed restore or failover test.&lt;br /&gt;Measure recovery time and data loss." fill="#a0c4fb" data-text-color="#14315e" data-font-family="noto_sans" data-font-size="22" data-text-align="left" data-text-align-vertical="middle" stroke="#6a8bbf" stroke-width="2" />
    <rect id="m3458764690575950832" x="64" y="1024" width="768" height="160" data-content="Capacity and availability" fill="#ddddd8" data-text-color="#434339" data-font-family="noto_sans" data-font-size="22" data-text-align="left" data-text-align-vertical="middle" stroke="#a8a8a0" stroke-width="2" />
    <rect id="m3458764690575950833" x="896" y="1024" width="1056" height="160" data-content="Review sizing, redundancy and limits&lt;br /&gt;against the agreed expected load." fill="#a0c4fb" data-text-color="#14315e" data-font-family="noto_sans" data-font-size="22" data-text-align="left" data-text-align-vertical="middle" stroke="#6a8bbf" stroke-width="2" />
    <rect id="m3458764690575950836" x="2016" y="1024" width="1072" height="160" data-content="Run health and integration tests.&lt;br /&gt;Measure required load/latency targets." fill="#a0c4fb" data-text-color="#14315e" data-font-family="noto_sans" data-font-size="22" data-text-align="left" data-text-align-vertical="middle" stroke="#6a8bbf" stroke-width="2" />
    <rect id="m3458764690575950837" x="64" y="1264" width="1432" height="224" data-content="&lt;b&gt;01B checks and plan: before apply&lt;/b&gt;&lt;br&gt;terraform validate checks syntax and consistency.&lt;br&gt;Plan review checks intended changes and replacements.&lt;br&gt;These feed review and approval in 01B steps 2–8." fill="#ddddd8" data-text-color="#434339" data-font-family="noto_sans" data-font-size="22" data-text-align="left" data-text-align-vertical="middle" stroke="#a8a8a0" stroke-width="2" />
    <rect id="m3458764690575950838" x="1656" y="1264" width="1432" height="224" data-content="&lt;b&gt;01B step 10: acceptance before promotion&lt;/b&gt;&lt;br&gt;Verify requirements and record the deployment evidence.&lt;br&gt;Successful apply alone does not establish acceptance.&lt;br&gt;Required tests must pass before the next stage in &lt;a href=&quot;https://miro.com/app/board/uXjVEOGaQYU=/?moveToWidget=3458764690575950778&quot;&gt;01D&lt;/a&gt;." fill="#ffe86d" data-text-color="#574900" data-font-family="noto_sans" data-font-size="22" data-text-align="left" data-text-align-vertical="middle" stroke="#cbb333" stroke-width="2" />
    <rect id="m3458764690575950851" x="64" y="1552" width="3024" height="128" data-content="&lt;b&gt;Agree before implementation:&lt;/b&gt; criteria, test owners, thresholds, evidence and exception authority.&lt;br /&gt;Separate code review, authorization to apply, and acceptance to promote. Apply the exact authorized target plan; re-plan and authorize if invalidated." fill="#ffe86d" data-text-color="#574900" data-font-family="noto_sans" data-font-size="22" data-text-align="left" data-text-align-vertical="middle" stroke="#cbb333" stroke-width="2" />
    <textArea id="m3458764690575950852" x="64" y="1817" width="3024" height="26" fill="#595959" font-family="noto_sans" font-size="18" text-align="left">Reference: HashiCorp validate, plan, apply and test documentation. Terraform integration tests may create real resources; select an agreed test scope. Saved Nov 16, 2026.</textArea>
  </g>
</svg>