<svg viewBox="0 0 3840 2160" xmlns="http://www.w3.org/2000/svg">
<g id="m3458764690575950778" data-miro-id="3458764690575950778" transform="translate(6894,2)" data-frame="01D Terraform: branches and promotion">
<rect data-type="frame" x="0" y="0" width="3152" height="1910" fill="#ffffff" data-title="01D Terraform: branches and promotion" />
<textArea id="m3458764690575950790" data-miro-id="3458764690575950790" x="64" y="72.5" width="3024" height="47" fill="#1a1a1a" font-family="noto_sans" font-size="33" text-align="left" font-weight="bold">01D Terraform: branches and promotion</textArea>
<textArea id="m3458764690575950791" data-miro-id="3458764690575950791" x="64" y="152.5" width="3024" height="31" fill="#595959" font-family="noto_sans" font-size="22" text-align="left">CTO / developers / DevOps | Draft recommendation | Merge reviewed code once; authorize and verify each environment separately.</textArea>
<textArea id="m3458764690575950792" data-miro-id="3458764690575950792" x="64" y="1757" width="3024" height="26" fill="#595959" font-family="noto_sans" font-size="18" text-align="left">Blue = proposed process | Gray = explanation or evidence | Yellow = gate, alternative or team decision</textArea>
<textArea id="m3458764690575950793" data-miro-id="3458764690575950793" x="64" y="248.5" width="3024" height="31" fill="#1a1a1a" font-family="noto_sans" font-size="22" text-align="left" font-weight="bold">Three different choices</textArea>
<rect id="m3458764690575950794" data-miro-id="3458764690575950794" x="64" y="320" width="880" height="192" data-content="&lt;b&gt;Branch / commit&lt;/b&gt;&lt;br /&gt;Which version of the code is selected.&lt;br /&gt;A branch name alone does not select dev or prod." fill="#ddddd8" data-text-color="#434339" data-font-family="noto_sans" data-font-size="22" data-text-align="left" data-text-align-vertical="middle" stroke="#a8a8a0" />
<rect id="m3458764690575950795" data-miro-id="3458764690575950795" x="1104" y="320" width="880" height="192" data-content="&lt;b&gt;Environment target&lt;/b&gt;&lt;br /&gt;Configuration folder + inputs + state&lt;br /&gt;and cloud identity select what is changed." fill="#ddddd8" data-text-color="#434339" data-font-family="noto_sans" data-font-size="22" data-text-align="left" data-text-align-vertical="middle" stroke="#a8a8a0" />
<rect id="m3458764690575950796" data-miro-id="3458764690575950796" x="2144" y="320" width="880" height="192" data-content="&lt;b&gt;Release / tag&lt;/b&gt;&lt;br /&gt;An optional label for a specific version.&lt;br /&gt;It can identify the version tested in dev first." fill="#ddddd8" data-text-color="#434339" data-font-family="noto_sans" data-font-size="22" data-text-align="left" data-text-align-vertical="middle" stroke="#a8a8a0" />
<textArea id="m3458764690575950797" data-miro-id="3458764690575950797" x="64" y="580.5" width="3024" height="31" fill="#1a1a1a" font-family="noto_sans" font-size="22" text-align="left" font-weight="bold">Recommended per-change flow: main branch with explicit promotion</textArea>
<rect id="m3458764690575950798" data-miro-id="3458764690575950798" x="64" y="656" width="400" height="256" data-content="&lt;b&gt;1. Review the PR&lt;/b&gt;&lt;br /&gt;Checks and preview plans.&lt;br /&gt;Review code and target impact." fill="#a0c4fb" data-text-color="#14315e" data-font-family="noto_sans" data-font-size="22" data-text-align="left" data-text-align-vertical="middle" stroke="#6a8bbf" />
<rect id="m3458764690575950799" data-miro-id="3458764690575950799" x="584" y="656" width="400" height="256" data-content="&lt;b&gt;2. Merge to main&lt;/b&gt;&lt;br /&gt;Record the exact revision.&lt;br /&gt;Production does not run&lt;br /&gt;just because code merged." fill="#a0c4fb" data-text-color="#14315e" data-font-family="noto_sans" data-font-size="22" data-text-align="left" data-text-align-vertical="middle" stroke="#6a8bbf" />
<rect id="m3458764690575950800" data-miro-id="3458764690575950800" x="1104" y="656" width="400" height="256" data-content="&lt;b&gt;3. Apply to dev&lt;/b&gt;&lt;br /&gt;Generate the final dev plan.&lt;br /&gt;Authorize under dev policy.&lt;br /&gt;Actions applies that plan." fill="#a0c4fb" data-text-color="#14315e" data-font-family="noto_sans" data-font-size="22" data-text-align="left" data-text-align-vertical="middle" stroke="#6a8bbf" />
<rect id="m3458764690575950801" data-miro-id="3458764690575950801" x="1624" y="656" width="400" height="256" data-content="&lt;b&gt;4. Verify dev&lt;/b&gt;&lt;br /&gt;Check deployed settings.&lt;br /&gt;Run acceptance tests.&lt;br /&gt;Record the evidence." fill="#a0c4fb" data-text-color="#14315e" data-font-family="noto_sans" data-font-size="22" data-text-align="left" data-text-align-vertical="middle" stroke="#6a8bbf" />
<rect id="m3458764690575950802" data-miro-id="3458764690575950802" x="2144" y="656" width="400" height="256" data-content="&lt;b&gt;5. Promote to staging&lt;/b&gt;&lt;br /&gt;Select the tested version.&lt;br /&gt;Own plan, approval and apply.&lt;br /&gt;Verify staging requirements." fill="#a0c4fb" data-text-color="#14315e" data-font-family="noto_sans" data-font-size="22" data-text-align="left" data-text-align-vertical="middle" stroke="#6a8bbf" />
<rect id="m3458764690575950803" data-miro-id="3458764690575950803" x="2664" y="656" width="400" height="256" data-content="&lt;b&gt;6. Promote to production&lt;/b&gt;&lt;br /&gt;Select the tested version.&lt;br /&gt;Own plan, approval and apply.&lt;br /&gt;Verify production requirements." fill="#a0c4fb" data-text-color="#14315e" data-font-family="noto_sans" data-font-size="22" data-text-align="left" data-text-align-vertical="middle" stroke="#6a8bbf" />
<rect id="m3458764690575950804" data-miro-id="3458764690575950804" x="64" y="1072" width="1400" height="192" data-content="&lt;b&gt;Alternative: dev branch, then main branch&lt;/b&gt;&lt;br /&gt;This can work if workflows explicitly map each branch to its target.&lt;br /&gt;The branch mapping and each execution gate are team decisions." fill="#ffe86d" data-text-color="#574900" data-font-family="noto_sans" data-font-size="22" data-text-align="left" data-text-align-vertical="middle" stroke="#cbb333" />
<rect id="m3458764690575950805" data-miro-id="3458764690575950805" x="1624" y="1072" width="1464" height="192" data-content="&lt;b&gt;Required checks fail: stop promotion&lt;/b&gt;&lt;br /&gt;Correct the change, review it again and regenerate affected plans.&lt;br /&gt;A successful apply alone does not establish acceptance." fill="#ffe86d" data-text-color="#574900" data-font-family="noto_sans" data-font-size="22" data-text-align="left" data-text-align-vertical="middle" stroke="#cbb333" />
<rect id="m3458764690575950806" data-miro-id="3458764690575950806" x="64" y="1328" width="3024" height="160" data-content="&lt;b&gt;Promote a configuration version, not a dev plan file&lt;/b&gt;&lt;br /&gt;Each environment needs its own plan against its settings and current state. Never apply the dev plan to production.&lt;br /&gt;With separate folders, explicitly update the next target's configuration or tested module version; a tag does not copy edits between folders." fill="#ddddd8" data-text-color="#434339" data-font-family="noto_sans" data-font-size="22" data-text-align="left" data-text-align-vertical="middle" stroke="#a8a8a0" />
<rect id="m3458764690575950807" data-miro-id="3458764690575950807" x="64" y="1552" width="3024" height="128" data-content="&lt;b&gt;Team decisions:&lt;/b&gt; dev auto-apply versus approval; who accepts tests and authorizes promotion; revision/tag/module-version strategy.&lt;br /&gt;GitHub approval support depends on repository visibility and plan. This is per-change promotion, separate from rolling out the automation capability." fill="#ffe86d" data-text-color="#574900" data-font-family="noto_sans" data-font-size="22" data-text-align="left" data-text-align-vertical="middle" stroke="#cbb333" />
<textArea id="m3458764690575950808" data-miro-id="3458764690575950808" x="64" y="1817" width="3024" height="26" fill="#595959" font-family="noto_sans" font-size="18" text-align="left">Saved evidence: existing TL workflow plans development changes only; it has no apply job. Sources: Nov 3–4 snapshot; Terraform apply/plan and GitHub deployment documentation.</textArea>
<line id="m3458764690575950854" data-miro-id="3458764690575950854" x1="0" y1="0" x2="1" y2="1" data-start="m3458764690575950798" data-end="m3458764690575950799" stroke="#313131" stroke-width="2.0" data-arrow="end" data-shape="elbowed" data-start-side="right" data-end-side="left" data-content="Next" />
<line id="m3458764690575950855" data-miro-id="3458764690575950855" x1="0" y1="0" x2="1" y2="1" data-start="m3458764690575950799" data-end="m3458764690575950800" stroke="#313131" stroke-width="2.0" data-arrow="end" data-shape="elbowed" data-start-side="right" data-end-side="left" data-content="Next" />
<line id="m3458764690575950856" data-miro-id="3458764690575950856" x1="0" y1="0" x2="1" y2="1" data-start="m3458764690575950800" data-end="m3458764690575950801" stroke="#313131" stroke-width="2.0" data-arrow="end" data-shape="elbowed" data-start-side="right" data-end-side="left" data-content="Next" />
<line id="m3458764690575950857" data-miro-id="3458764690575950857" x1="0" y1="0" x2="1" y2="1" data-start="m3458764690575950801" data-end="m3458764690575950802" stroke="#313131" stroke-width="2.0" data-arrow="end" data-shape="elbowed" data-start-side="right" data-end-side="left" data-content="Pass" />
<line id="m3458764690575950858" data-miro-id="3458764690575950858" x1="0" y1="0" x2="1" y2="1" data-start="m3458764690575950802" data-end="m3458764690575950803" stroke="#313131" stroke-width="2.0" data-arrow="end" data-shape="elbowed" data-start-side="right" data-end-side="left" data-content="Pass" />
<line id="m3458764690575950861" data-miro-id="3458764690575950861" x1="0" y1="0" x2="1" y2="1" data-start="m3458764690575950801" data-end="m3458764690575950805" stroke="#313131" stroke-width="2.0" data-arrow="end" data-shape="elbowed" data-start-side="bottom" data-end-side="top" data-content="Failed required tests" />
</g>
<g id="m3458764690575950779" data-miro-id="3458764690575950779" transform="translate(10729,2)" data-frame="01E Terraform: verify the requirements">
<rect data-type="frame" x="0" y="0" width="3152" height="1910" fill="#ffffff" data-title="01E Terraform: verify the requirements" />
<textArea id="m3458764690575950809" data-miro-id="3458764690575950809" x="64" y="72.5" width="3024" height="47" fill="#1a1a1a" font-family="noto_sans" font-size="33" text-align="left" font-weight="bold">01E Terraform: verify the requirements</textArea>
<textArea id="m3458764690575950817" data-miro-id="3458764690575950817" x="64" y="152.5" width="3024" height="31" fill="#595959" font-family="noto_sans" font-size="22" text-align="left">Reviewers / QA / DevOps | Draft | Define measurable acceptance criteria before apply, then test the actual environment.</textArea>
<textArea id="m3458764690575950818" data-miro-id="3458764690575950818" x="64" y="1757" width="3024" height="26" fill="#595959" font-family="noto_sans" font-size="18" text-align="left">Blue = proposed process | Gray = explanation or evidence | Yellow = gate, alternative or team decision</textArea>
<textArea id="m3458764690575950819" data-miro-id="3458764690575950819" x="64" y="248.5" width="3024" height="31" fill="#1a1a1a" font-family="noto_sans" font-size="22" text-align="left" font-weight="bold">Examples to agree with the team; choose criteria and tests for each change</textArea>
<rect id="m3458764690575950820" data-miro-id="3458764690575950820" x="64" y="320" width="768" height="96" data-content="Requirement" fill="#ddddd8" data-text-color="#434339" data-font-family="noto_sans" data-font-size="22" data-font-weight="bold" data-text-align="left" data-text-align-vertical="middle" stroke="#a8a8a0" />
<rect id="m3458764690575950821" data-miro-id="3458764690575950821" x="896" y="320" width="1056" height="96" data-content="Before apply: planned configuration" fill="#ddddd8" data-text-color="#434339" data-font-family="noto_sans" data-font-size="22" data-font-weight="bold" data-text-align="left" data-text-align-vertical="middle" stroke="#a8a8a0" />
<rect id="m3458764690575950822" data-miro-id="3458764690575950822" x="2016" y="320" width="1072" height="96" data-content="After apply: deployed behavior" fill="#ddddd8" data-text-color="#434339" data-font-family="noto_sans" data-font-size="22" data-font-weight="bold" data-text-align="left" data-text-align-vertical="middle" stroke="#a8a8a0" />
<rect id="m3458764690575950823" data-miro-id="3458764690575950823" x="64" y="448" width="768" height="160" data-content="Database settings" fill="#ddddd8" data-text-color="#434339" data-font-family="noto_sans" data-font-size="22" data-text-align="left" data-text-align-vertical="middle" stroke="#a8a8a0" />
<rect id="m3458764690575950824" data-miro-id="3458764690575950824" x="896" y="448" width="1056" height="160" data-content="Private access; agreed region, engine,&lt;br /&gt;capacity and backup settings." fill="#a0c4fb" data-text-color="#14315e" data-font-family="noto_sans" data-font-size="22" data-text-align="left" data-text-align-vertical="middle" stroke="#6a8bbf" />
<rect id="m3458764690575950825" data-miro-id="3458764690575950825" x="2016" y="448" width="1072" height="160" data-content="Read back the actual settings.&lt;br /&gt;Confirm the application connects." fill="#a0c4fb" data-text-color="#14315e" data-font-family="noto_sans" data-font-size="22" data-text-align="left" data-text-align-vertical="middle" stroke="#6a8bbf" />
<rect id="m3458764690575950826" data-miro-id="3458764690575950826" x="64" y="640" width="768" height="160" data-content="Network and access" fill="#ddddd8" data-text-color="#434339" data-font-family="noto_sans" data-font-size="22" data-text-align="left" data-text-align-vertical="middle" stroke="#a8a8a0" />
<rect id="m3458764690575950827" data-miro-id="3458764690575950827" x="896" y="640" width="1056" height="160" data-content="Only required paths and roles.&lt;br /&gt;Review exposure and permission changes." fill="#a0c4fb" data-text-color="#14315e" data-font-family="noto_sans" data-font-size="22" data-text-align="left" data-text-align-vertical="middle" stroke="#6a8bbf" />
<rect id="m3458764690575950828" data-miro-id="3458764690575950828" x="2016" y="640" width="1072" height="160" data-content="Required traffic succeeds.&lt;br /&gt;Unauthorized traffic and identities fail." fill="#a0c4fb" data-text-color="#14315e" data-font-family="noto_sans" data-font-size="22" data-text-align="left" data-text-align-vertical="middle" stroke="#6a8bbf" />
<rect id="m3458764690575950829" data-miro-id="3458764690575950829" x="64" y="832" width="768" height="160" data-content="Recovery readiness" fill="#ddddd8" data-text-color="#434339" data-font-family="noto_sans" data-font-size="22" data-text-align="left" data-text-align-vertical="middle" stroke="#a8a8a0" />
<rect id="m3458764690575950830" data-miro-id="3458764690575950830" x="896" y="832" width="1056" height="160" data-content="Backup and recovery configuration&lt;br /&gt;matches the agreed recovery targets." fill="#a0c4fb" data-text-color="#14315e" data-font-family="noto_sans" data-font-size="22" data-text-align="left" data-text-align-vertical="middle" stroke="#6a8bbf" />
<rect id="m3458764690575950831" data-miro-id="3458764690575950831" x="2016" y="832" width="1072" height="160" data-content="Run an agreed restore or failover test.&lt;br /&gt;Measure recovery time and data loss." fill="#a0c4fb" data-text-color="#14315e" data-font-family="noto_sans" data-font-size="22" data-text-align="left" data-text-align-vertical="middle" stroke="#6a8bbf" />
<rect id="m3458764690575950832" data-miro-id="3458764690575950832" x="64" y="1024" width="768" height="160" data-content="Capacity and availability" fill="#ddddd8" data-text-color="#434339" data-font-family="noto_sans" data-font-size="22" data-text-align="left" data-text-align-vertical="middle" stroke="#a8a8a0" />
<rect id="m3458764690575950833" data-miro-id="3458764690575950833" x="896" y="1024" width="1056" height="160" data-content="Review sizing, redundancy and limits&lt;br /&gt;against the agreed expected load." fill="#a0c4fb" data-text-color="#14315e" data-font-family="noto_sans" data-font-size="22" data-text-align="left" data-text-align-vertical="middle" stroke="#6a8bbf" />
<rect id="m3458764690575950836" data-miro-id="3458764690575950836" x="2016" y="1024" width="1072" height="160" data-content="Run health and integration tests.&lt;br /&gt;Measure required load/latency targets." fill="#a0c4fb" data-text-color="#14315e" data-font-family="noto_sans" data-font-size="22" data-text-align="left" data-text-align-vertical="middle" stroke="#6a8bbf" />
<rect id="m3458764690575950837" data-miro-id="3458764690575950837" x="64" y="1264" width="1432" height="224" data-content="&lt;b&gt;Configuration validity is one layer&lt;/b&gt;&lt;br /&gt;terraform validate checks syntax and consistency.&lt;br /&gt;Plan review checks intended changes and replacements.&lt;br /&gt;Neither proves that user journeys or recovery work." fill="#ddddd8" data-text-color="#434339" data-font-family="noto_sans" data-font-size="22" data-text-align="left" data-text-align-vertical="middle" stroke="#a8a8a0" />
<rect id="m3458764690575950838" data-miro-id="3458764690575950838" x="1656" y="1264" width="1432" height="224" data-content="&lt;b&gt;Acceptance controls promotion&lt;/b&gt;&lt;br /&gt;Require the relevant tests to pass before moving on.&lt;br /&gt;Record revision, target, plan approval and apply result.&lt;br /&gt;Keep the test evidence with that deployment." fill="#ffe86d" data-text-color="#574900" data-font-family="noto_sans" data-font-size="22" data-text-align="left" data-text-align-vertical="middle" stroke="#cbb333" />
<rect id="m3458764690575950851" data-miro-id="3458764690575950851" x="64" y="1552" width="3024" height="128" data-content="&lt;b&gt;Agree before implementation:&lt;/b&gt; criteria, test owners, thresholds, evidence and exception authority.&lt;br /&gt;Separate code review, authorization to apply, and acceptance to promote. Apply the exact authorized target plan; re-plan and authorize if invalidated." fill="#ffe86d" data-text-color="#574900" data-font-family="noto_sans" data-font-size="22" data-text-align="left" data-text-align-vertical="middle" stroke="#cbb333" />
<textArea id="m3458764690575950852" data-miro-id="3458764690575950852" x="64" y="1817" width="3024" height="26" fill="#595959" font-family="noto_sans" font-size="18" text-align="left">Reference: HashiCorp validate, plan, apply and test documentation. Terraform integration tests may create real resources; select an agreed test scope. Saved Nov 16, 2026.</textArea>
</g>
</svg>

